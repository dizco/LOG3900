matrix:
  include:
    #- language: node_js
    #  node_js: 8
    #  env: TO_TEST=SERVEUR
    - language: objective-c
      osx_image: xcode9
      env: TO_TEST=CLIENT_LEGER
    #- language: csharp
    #  solution: PolyPaint.sln
    #  env: TO_TEST=CLIENT_LOURD
  fast_finish: true

before_install:
  - if [ "$TO_TEST" = "SERVEUR" ]; then cd serveur; fi
  - if [ "$TO_TEST" = "CLIENT_LOURD" ]; then cd client-lourd; fi
  - if [ "$TO_TEST" = "CLIENT_LEGER" ]; then cd client-leger; fi

after_install:
  - if [ "$TO_TEST" = "SERVEUR" ]; then npm rebuild node-sass; fi

script:
  - if [ "$TO_TEST" = "SERVEUR" ]; then npm run build; fi
  - if [ "$TO_TEST" = "SERVEUR" ]; then npm run test; fi
  - if [ "$TO_TEST" = "CLIENT_LOURD" ]; then xbuild PolyPaint.sln; fi
  - if [ "$TO_TEST" = "CLIENT_LEGER"]; then xcodebuild clean test -project PolyPaintPro.xcodeproj -scheme PolyPaintPro -destination "platform=iOS Simulator,name=iPhone 7,OS=10.3" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO; fi

notifications:
  email: false
  slack: 
    rooms:
      - polypaintpro:2k3JgBABp3cePFJyKkDIp42Q#travis-ci
    on_success: change # default: always
    on_failure: always # default: always

branches:
  only: 
    - master
